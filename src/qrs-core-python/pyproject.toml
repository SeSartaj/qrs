[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrs"
version = "0.1.0"
description = "SDoc Verification Protocol core: offline-first, cross-organization verification of digitally signed documents (TCert / SDoc / Statement). Minimal audited runtime deps; inversion-of-control storage and context."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sartaj Ahmad Masoud" }]
keywords = ["sdoc", "verification", "digital-signature", "qrcode", "offline-first", "tcert", "cbor", "cose", "ed25519", "ecdsa"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "mypy", "hypothesis"]

[project.urls]
Repository = "https://example.invalid/qrs"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pytest.mypy"]

[tool.coverage.run]
branch = true
source = ["src"]